<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="74" font-size="46" font-weight="700" fill="#4f46e5">Ravi</text>
  <text x="176" y="74" font-size="20" font-weight="600" fill="#334155">self-hosted AI assistant</text>
  <text x="60" y="104" font-size="16" fill="#64748b">Runs entirely on my own hardware, on the same homelab stack.</text>

  <!-- ==== Pipeline row (center y = 224) ==== -->
  <text x="60" y="150" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CHANNELS</text>

  <!-- channel chips -->
  <g filter="url(#shadow)">
    <rect x="60" y="165" width="150" height="38" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="60" y="211" width="150" height="38" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="60" y="257" width="150" height="38" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="82" cy="184" r="6" fill="#229ED9"/><text x="98" y="189" font-size="15" font-weight="600" fill="#0f172a">Telegram</text>
  <circle cx="82" cy="230" r="6" fill="#25D366"/><text x="98" y="235" font-size="15" font-weight="600" fill="#0f172a">WhatsApp</text>
  <circle cx="82" cy="276" r="6" fill="#64748b"/><text x="98" y="281" font-size="15" font-weight="600" fill="#0f172a">Web (SSO)</text>

  <!-- arrows + boxes -->
  <line x1="214" y1="230" x2="242" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="246" y="196" width="140" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="316" y="228" font-size="18" font-weight="700" fill="#0ea5e9" text-anchor="middle">Caddy</text>
  <text x="316" y="248" font-size="12.5" fill="#64748b" text-anchor="middle">HTTPS reverse proxy</text>

  <line x1="390" y1="230" x2="418" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="422" y="196" width="150" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="497" y="228" font-size="18" font-weight="700" fill="#ef4444" text-anchor="middle">Authentik</text>
  <text x="497" y="248" font-size="12.5" fill="#64748b" text-anchor="middle">single sign-on</text>

  <line x1="576" y1="230" x2="604" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OpenClaw / Ravi -->
  <g filter="url(#shadow)">
    <rect x="608" y="184" width="216" height="92" rx="14" fill="#4f46e5"/>
  </g>
  <text x="716" y="222" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">OpenClaw</text>
  <text x="716" y="248" font-size="13.5" fill="#c7d2fe" text-anchor="middle">the &#8220;Ravi&#8221; gateway</text>

  <line x1="828" y1="230" x2="856" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Models -->
  <g filter="url(#shadow)">
    <rect x="860" y="184" width="280" height="92" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="884" y="212" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MODELS (free tier)</text>
  <text x="884" y="238" font-size="15" font-weight="600" fill="#0f172a">Groq &#183; Llama 3.3 70B</text>
  <text x="884" y="260" font-size="15" font-weight="600" fill="#0f172a">Gemini 2.5 Flash</text>

  <!-- connector down to tools -->
  <path d="M716,276 L716,330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==== Tools panel ==== -->
  <rect x="60" y="336" width="1080" height="244" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="374" font-size="20" font-weight="700" fill="#0f172a">What Ravi can do</text>

  <!-- chips 3 x 2 -->
  <!-- row1 -->
  <g filter="url(#shadow)">
    <rect x="88" y="392" width="320" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="440" y="392" width="320" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="792" y="392" width="320" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="112" cy="420" r="7" fill="#4f46e5"/><text x="128" y="425" font-size="16" font-weight="700" fill="#0f172a">Ask my knowledge base</text>
  <text x="112" y="450" font-size="13.5" fill="#64748b">Search &amp; write my Outline wiki</text>

  <circle cx="464" cy="420" r="7" fill="#0ea5e9"/><text x="480" y="425" font-size="16" font-weight="700" fill="#0f172a">Make podcasts</text>
  <text x="464" y="450" font-size="13.5" fill="#64748b">Topics &amp; book chapters, MS Edge TTS</text>

  <circle cx="816" cy="420" r="7" fill="#f59e0b"/><text x="832" y="425" font-size="16" font-weight="700" fill="#0f172a">Find flights</text>
  <text x="816" y="450" font-size="13.5" fill="#64748b">Live Google Flights data</text>

  <!-- row2 -->
  <g filter="url(#shadow)">
    <rect x="88" y="484" width="320" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="440" y="484" width="320" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="792" y="484" width="320" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="112" cy="512" r="7" fill="#22c55e"/><text x="128" y="517" font-size="16" font-weight="700" fill="#0f172a">Drive the browser</text>
  <text x="112" y="542" font-size="13.5" fill="#64748b">Log in, fill forms, scrape</text>

  <circle cx="464" cy="512" r="7" fill="#ec4899"/><text x="480" y="517" font-size="16" font-weight="700" fill="#0f172a">Make diagrams</text>
  <text x="464" y="542" font-size="13.5" fill="#64748b">Architecture &amp; flow sketches</text>

  <circle cx="816" cy="512" r="7" fill="#8b5cf6"/><text x="832" y="517" font-size="16" font-weight="700" fill="#0f172a">Remember preferences</text>
  <text x="816" y="542" font-size="13.5" fill="#64748b">Searchable long-term memory</text>

  <!-- footer -->
  <text x="600" y="608" font-size="14" fill="#94a3b8" text-anchor="middle">shaimakreddy.com &#183; docker-startup-kit</text>
</svg>
</body>
</html>
